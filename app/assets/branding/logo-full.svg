    <g stroke="#FFFFFF" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" fill="none" transform="translate(36,36) scale(0.62)">
      <path d="M150 160 H200"/>
      <path d="M150 224 H200"/>
      <path d="M200 160 V224"/>
      <path d="M200 192 H256"/>
      <path d="M150 288 H200"/>
      <path d="M150 352 H200"/>
      <path d="M200 288 V352"/>
      <path d="M200 320 H256"/>
      <path d="M256 192 V320"/>
      <path d="M256 256 H332"/>
    </g>
    <rect x="120" y="106" width="36" height="36" rx="8" transform="rotate(45 138 124)" fill="url(#node2)"/>
  </g>

  <!-- wordmark -->
  <text x="300" y="180" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="120" font-weight="800" letter-spacing="-5" fill="url(#word)">Pro</text>
  <text x="476" y="180" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="120" font-weight="800" letter-spacing="-5" fill="#22D3EE">Tourney</text>
