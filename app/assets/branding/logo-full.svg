<svg width="960" height="288" viewBox="0 0 960 288" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ProTourney logo">
  <defs>
    <linearGradient id="badge2" x1="32" y1="32" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="0.55" stop-color="#6D28D9"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="node2" x1="190" y1="124" x2="226" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FDE68A"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="word" x1="312" y1="96" x2="312" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F5F3FF"/>
      <stop offset="1" stop-color="#C4B5FD"/>
    </linearGradient>
  </defs>

  <!-- mark -->
  <g transform="translate(32,32)">
