name: turneyapp
description: "ProTourney — online tournament platform (mobile + web)."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.2

  # State management & routing
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # Backend
  supabase_flutter: ^2.8.4

  # UI
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.16
  cached_network_image: ^3.4.1
  qr_flutter: ^4.1.0

  # Utilities
  # Pinned by flutter_localizations (SDK) to 0.20.x.
  intl: ^0.20.2
  uuid: ^4.5.1
  image_picker: ^1.1.2
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

# App launcher icon + web favicon — generated with:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/icons/app_icon.png"
  android: true
  min_sdk_android: 21
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icons/app_icon.png"
    background_color: "#120A0D"
    theme_color: "#9E1B32"

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/icons/
