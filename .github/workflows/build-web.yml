name: Build Web

on:
  push:
    branches: ["claude/online-tournament-app-04fj47", "main"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  web:
    name: Flutter Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Scaffold Web project
        run: flutter create --org com.turneyapp --project-name turneyapp --platforms=web .

      - name: Install dependencies
        run: flutter pub get

      - name: Build Web
        run: |
          flutter build web --release \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - name: Upload web bundle
        uses: actions/upload-artifact@v4
        with:
          name: turneyapp-web
          path: app/build/web
          if-no-files-found: error

      - name: Package web bundle for release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cd build && zip -r ../turneyapp-web.zip web

      - name: Attach to release (tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/turneyapp-web.zip
