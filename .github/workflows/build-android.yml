name: Build Android

on:
  push:
    branches: ["claude/online-tournament-app-04fj47", "main"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  android:
    name: Android (APK + AAB)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Generate android/ (incl. the Gradle wrapper) for this Flutter version.
      - name: Scaffold Android project
        run: flutter create --org com.turneyapp --project-name turneyapp --platforms=android .

      # Signing is OPTIONAL. The pristine `flutter create` build file already
      # debug-signs the release (installable) — that's the default unsigned
      # build. When a keystore secret is present we inject a release signing
      # config (AGP 9 / new DSL) without touching the generated file otherwise.
      - name: Configure release signing (optional)
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Keystore provided — release will be signed."
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/keystore.jks
            cat > android/key.properties <<EOF
          storeFile=keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
            cat >> android/app/build.gradle.kts <<'GRADLE'

          // --- TurneyApp release signing (injected by CI when a keystore exists) ---
          val turneyKeyProps = java.util.Properties().apply {
              load(java.io.FileInputStream(rootProject.file("key.properties")))
          }
          extensions.configure<com.android.build.api.dsl.ApplicationExtension> {
              signingConfigs {
                  create("release") {
                      keyAlias = turneyKeyProps["keyAlias"] as String
                      keyPassword = turneyKeyProps["keyPassword"] as String
                      storeFile = file(turneyKeyProps["storeFile"] as String)
                      storePassword = turneyKeyProps["storePassword"] as String
                  }
              }
              buildTypes {
                  getByName("release") {
                      signingConfig = signingConfigs.getByName("release")
                  }
              }
          }
          GRADLE
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No keystore secret — building UNSIGNED (debug-signed, installable)."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - name: Build App Bundle
        run: |
          flutter build appbundle --release \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: turneyapp-android-apk-${{ steps.signing.outputs.signed == 'true' && 'signed' || 'unsigned' }}
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: turneyapp-android-aab-${{ steps.signing.outputs.signed == 'true' && 'signed' || 'unsigned' }}
          path: app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Attach to release (tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/app/outputs/flutter-apk/app-release.apk
            app/build/app/outputs/bundle/release/app-release.aab
